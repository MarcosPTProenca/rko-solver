[workspace]
resolver = "3"
members = ["engines/rust/rko-core", "engines/cpp", "engines/rust/rko-py"]
default-members = ["engines/rust/rko-core"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
