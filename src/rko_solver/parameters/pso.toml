# Parameters for Particle Swarm Optimization (PSO).
# [offline]  — single values used when control = 0.
# [online]   — discrete lists that define the Q-Learning parameter grid
#              (axis order: p_size → c1 → c2 → w).
# Note: p_size is stored as float in [online] and cast to int at runtime.

[offline]
p_size = 30    # swarm size (number of particles)
c1     = 2.0   # cognitive (personal-best) acceleration coefficient
c2     = 2.0   # social (global-best) acceleration coefficient
w      = 0.70  # inertia weight

[online]
p_size = [20.0, 30.0, 50.0]
c1     = [1.5, 2.0, 2.5]
c2     = [1.5, 2.0, 2.5]
w      = [0.4, 0.7, 0.9]
