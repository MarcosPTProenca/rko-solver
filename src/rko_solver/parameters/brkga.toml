# Parameters for BRKGA (Biased Random-Key Genetic Algorithm).
# [offline]  — single values used when control = 0.
# [online]   — discrete lists that define the Q-Learning parameter grid
#              (axis order: p → pe → pm → rhoe).
# Note: p is stored as float in [online] and cast to int at runtime.

[offline]
p    = 50    # population size
pe   = 0.15  # elite fraction
pm   = 0.10  # mutant fraction
rhoe = 0.70  # elite gene inheritance probability

[online]
p    = [30.0, 50.0, 100.0]
pe   = [0.10, 0.15, 0.20]
pm   = [0.05, 0.10, 0.15]
rhoe = [0.60, 0.70, 0.80]
