name: Wheels

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64-cpp
            manylinux: "2_28"
            cpp: "1"
          - os: ubuntu-24.04-arm
            label: linux-aarch64-cpp
            manylinux: "2_28"
            cpp: "1"
          - os: windows-latest
            label: windows-x86_64
            manylinux: "off"
            cpp: ""
          - os: windows-11-arm
            label: windows-arm64
            manylinux: "off"
            cpp: ""
          - os: macos-latest
            label: macos-arm64
            manylinux: "off"
            cpp: ""
          - os: macos-15-intel
            label: macos-x86_64
            manylinux: "off"
            cpp: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Build wheel with maturin v1.51.0
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        env:
          RKO_BUILD_CPP: ${{ matrix.cpp }}
        with:
          command: build
          args: --release --locked --out dist
          manylinux: ${{ matrix.manylinux }}
          docker-options: -e RKO_BUILD_CPP
      - name: Upload wheel v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wheel-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Set up uv v10.3.2
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Build source distribution
        run: uv build --sdist --out-dir dist
      - name: Upload source distribution v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64-cpp
            cpp: "1"
          - os: ubuntu-24.04-arm
            label: linux-aarch64-cpp
            cpp: "1"
          - os: windows-latest
            label: windows-x86_64
            cpp: ""
          - os: windows-11-arm
            label: windows-arm64
            cpp: ""
          - os: macos-latest
            label: macos-arm64
            cpp: ""
          - os: macos-15-intel
            label: macos-x86_64
            cpp: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Set up uv v10.3.2
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Download wheel v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: wheel-${{ matrix.label }}
          path: dist
      - name: Inspect wheel contents
        shell: bash
        run: |
          uv run --no-project python -I - dist/*.whl <<'PY'
          import sys
          import zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          required = (
              "dist-info/licenses/LICENSE",
              "dist-info/licenses/NOTICE",
              "dist-info/licenses/engines/THIRD_PARTY_LICENSES.txt",
          )
          missing = [item for item in required if not any(name.endswith(item) for name in names)]
          assert not missing, missing
          assert any("/_native" in name for name in names), "extension module missing"
          PY
      - name: Installed wheel smoke test
        shell: bash
        run: uv run --isolated --no-project --with dist/*.whl python -I tools/smoke_installed.py
      - name: C++ backend is bundled and runs
        if: matrix.cpp == '1'
        shell: bash
        run: uv run --isolated --no-project --with dist/*.whl python -I tools/smoke_cpp_installed.py

  free-threaded:
    needs: sdist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Set up uv v10.3.2
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Download source distribution v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sdist
          path: dist
      - name: Install the sdist on free-threaded CPython 3.14 and keep the GIL disabled
        run: |
          uv run --isolated --no-project --python 3.14t --with dist/*.tar.gz python -I - <<'PY'
          import sys

          from rko_solver import RKO
          from rko_solver import _native

          problem = _native.KnapsackProblem(list(range(10, 62, 4)), list(range(5, 31, 2)), 60)
          assert RKO(problem, engine="rust", random_state=1).solve(1).cost < 0
          assert not sys._is_gil_enabled()
          PY
