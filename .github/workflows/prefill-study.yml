name: Expanded prefill study

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expanded-prefill-study
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        dimension: [20, 100, 500]
        evaluations: [256, 1024]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv v10.3.2
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - run: uv sync --locked --group dev
      - name: Run serial matched-work shard
        run: |
          mkdir -p raw
          uv run --locked python benchmarks/prefill_work.py \
            --dimension "${{ matrix.dimension }}" \
            --evaluations "${{ matrix.evaluations }}" \
            --capacity 10 --seeds 20 \
            > "raw/prefill-${{ matrix.dimension }}-${{ matrix.evaluations }}.jsonl"
      - name: Upload raw shard v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: prefill-raw-${{ matrix.dimension }}-${{ matrix.evaluations }}
          path: raw/*.jsonl
          if-no-files-found: error
          retention-days: 90
  report:
    needs: study
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv v10.3.2
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - run: uv sync --locked --group dev
      - name: Download raw shards v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: prefill-raw-*
          path: raw
          merge-multiple: true
      - name: Validate and compact paired evidence
        run: |
          uv run --locked python benchmarks/prefill_report.py \
            --input-dir raw --output-prefix report/prefill-expanded --run-url "$RUN_URL"
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('report/prefill-expanded-summary.json').read_text())
          assert report['pairs'] == 1440 and len(report['groups']) == 72
          assert all(row['pairs'] == 20 and row['capacity'] == 10 for row in report['groups'])
          assert {(row['dimension'], row['evaluations']) for row in report['groups']} == {
              (dimension, budget) for dimension in (20, 100, 500) for budget in (256, 1024)
          }
          PY
          echo 'Validated 1,440 paired comparisons / 2,880 trials. No timing measurements.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compact report v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: prefill-expanded-report
          path: report/*
          if-no-files-found: error
          retention-days: 90
