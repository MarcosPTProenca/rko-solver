[project]
name = "rko-quantile-training"
version = "0.0.0"
description = "Isolated processor-only training for repository quantile experiments"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.5.4",
    "pytest==9.1.1",
    "torch==2.15.0+cpu",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
